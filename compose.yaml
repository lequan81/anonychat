services:
  anonychat.products.codechovui.dev:
    build: .
    container_name: anonychat.products.codechovui.dev
    hostname: anonychat.products.codechovui.dev
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.anonychat.rule=Host(`anonychat.products.codechovui.dev`)"
      - "traefik.http.routers.anonychat.entrypoints=websecure"
      - "traefik.http.routers.anonychat.tls.certresolver=myresolver"
      - "traefik.http.services.anonychat.loadbalancer.server.port=3000"
      # # Disable response buffering so WebSocket frames are forwarded immediately
      # - "traefik.http.services.anonychat.loadbalancer.responseForwarding.flushInterval=-1"
      # # Remove idle/response timeouts for WebSocket connections:
      # # responseHeaderTimeout=0 disables the per-request response-header deadline on
      # # the Traefik → backend leg, preventing Traefik from closing WS connections
      # # that are idle (no frame) for longer than the default ~60 s.
      # - "traefik.http.serversTransports.anonychat-ws-transport.forwardingTimeouts.responseHeaderTimeout=0"
      # - "traefik.http.services.anonychat.loadbalancer.serversTransport=anonychat-ws-transport"
    networks:
      - traefik_default
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs

networks:
  traefik_default:
    external: true
