services:
  anonychat.products.codechovui.dev:
    build: .
    container_name: anonychat.products.codechovui.dev
    hostname: anonychat.products.codechovui.dev
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.anonychat.rule=Host(`anonychat.products.codechovui.dev`)"
      - "traefik.http.routers.anonychat.entrypoints=websecure"
      - "traefik.http.routers.anonychat.tls.certresolver=myresolver"
      - "traefik.http.services.anonychat.loadbalancer.server.port=3000"
    networks:
      - traefik_default
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs

networks:
  traefik_default:
    external: true
